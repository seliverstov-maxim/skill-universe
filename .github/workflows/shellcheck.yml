name: ShellCheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Analyze shell sources
        run: shellcheck --check-sourced --external-sources --source-path=SCRIPTDIR skill-universe install.sh docs/install.sh commands/*.sh scripts/*.sh verification/setup.sh verification/fixtures/skills/example-skill/scripts/*.sh
