name: OpenSSF Scorecard

on:
  schedule:
    - cron: '23 7 * * 1'
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Publish OpenSSF Scorecard results
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5
        with:
          results_file: scorecard.json
          results_format: json
          publish_results: true
