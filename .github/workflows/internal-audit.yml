name: Internal audit consistency

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require release promotion from develop
        if: github.event_name == 'pull_request'
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        shell: sh
        run: |
          if [ "$HEAD_BRANCH" != develop ] || [ "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
            printf '%s\n' 'Ordinary contributions target develop. Release pull requests to main must come from this repository develop branch.' >&2
            exit 1
          fi
      - name: Check report coverage and generated badge
        run: sh scripts/generate-audit-badges.sh --check
