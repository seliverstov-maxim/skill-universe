name: ClamAV

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '43 7 * * 2'

permissions:
  contents: read

jobs:
  malware-scan:
    name: ClamAV
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record scanned source
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/clamav-report.txt"
          date -u '+%Y-%m-%dT%H:%M:%SZ' >> "$RUNNER_TEMP/clamav-report.txt"
      - name: Update official virus signatures
        run: |
          docker volume create skill-universe-clamav
          docker run --rm \
            --mount source=skill-universe-clamav,target=/var/lib/clamav \
            --entrypoint=freshclam \
            clamav/clamav:stable@sha256:638d90201ee7ee6a82d249a2fc23b132e578673b5f1f2766852b127676ca1ef6 \
            --stdout | tee -a "$RUNNER_TEMP/clamav-report.txt"
      - name: Scan checkout without network access
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp \
            --cap-drop=ALL --security-opt=no-new-privileges \
            --mount type=bind,source="$GITHUB_WORKSPACE",target=/source,readonly \
            --mount source=skill-universe-clamav,target=/var/lib/clamav,readonly \
            --entrypoint=clamscan \
            clamav/clamav:stable@sha256:638d90201ee7ee6a82d249a2fc23b132e578673b5f1f2766852b127676ca1ef6 \
            --recursive --infected --alert-exceeds-max=yes \
            --follow-dir-symlinks=0 --follow-file-symlinks=0 \
            --exclude-dir='^/source/\.git$' /source \
            | tee -a "$RUNNER_TEMP/clamav-report.txt"
      - name: Publish antivirus report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clamav-report
          path: ${{ runner.temp }}/clamav-report.txt
          retention-days: 30
